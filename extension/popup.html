<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zillow Agent Scraper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 Zillow Scraper</h1>
            <p class="subtitle">Extract agent data</p>
        </header>

        <div id="status" class="status">
            <span class="status-badge" id="statusBadge">Ready</span>
        </div>

        <div id="controls" class="controls">
            <div class="button-group">
                <button id="extractBtn" class="btn btn-primary btn-large">
                    <span class="btn-icon">📋</span>
                    <span>Extract This Page</span>
                </button>
                <button id="nextBtn" class="btn btn-secondary">
                    <span class="btn-icon">▶️</span>
                    <span>Next Page</span>
                </button>
            </div>

            <div class="setting-group" style="margin-top: 15px;">
                <label for="maxLeads">Stop After X Agents:</label>
                <input type="number" id="maxLeads" value="100" min="1">
            </div>

            <button id="downloadBtn" class="btn btn-primary" style="margin-top: 10px; display: none;">
                <span class="btn-icon">⬇️</span>
                <span>Download CSV</span>
            </button>
        </div>

        <div id="progress" class="progress-section" style="display: none;">
            <div class="progress-item">
                <label>Agents Extracted:</label>
                <span id="agentsCount">0</span>
            </div>
            <div class="progress-item">
                <label>Phones Found:</label>
                <span id="phonesCount">0</span>
            </div>
            <p id="currentAction" class="current-action">Extracting...</p>
        </div>

        <div id="selectorMode" class="selector-mode" style="display: none;">
            <h3>📍 Select Next Page Button</h3>
            <p>Click the element you want to use as the "Next" button on this page</p>
            <button id="selectorCancel" class="btn btn-secondary">Cancel</button>
        </div>

        <footer>
            <p id="footerText">On Zillow Find an Agent page - Click "Extract This Page" to start</p>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
