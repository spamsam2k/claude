<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zillow Agent Phone Scraper Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #007AFF;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .table-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            flex: 1;
            max-width: 300px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #007AFF;
            color: white;
        }
        .btn-primary:hover {
            background: #0051d5;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f9f9f9;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            border-bottom: 2px solid #e0e0e0;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .phone {
            font-weight: 600;
            color: #007AFF;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        .phone.empty {
            color: #ccc;
            font-style: italic;
        }
        .agent-name {
            font-weight: 500;
            color: #1a1a1a;
        }
        .status-extracted {
            color: #34C759;
            font-weight: 600;
        }
        .status-pending {
            color: #FF9500;
        }
        .pagination {
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        .no-data {
            padding: 40px;
            text-align: center;
            color: #999;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: #34C759;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Zillow Agent Phone Scraper</h1>
            <p class="subtitle">Real-time extraction of agent contact information</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalAgents">0</div>
                <div class="stat-label">Total Agents</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="phonesFound">0</div>
                <div class="stat-label">Phones Found</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="extractionRate">0%</div>
                <div class="stat-label">Extraction Rate</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by name, phone, or brokerage..." />
                </div>
                <div class="action-buttons">
                    <button class="btn-primary" onclick="location.reload()">Refresh</button>
                    <button class="btn-secondary" onclick="downloadCSV()">Download CSV</button>
                </div>
            </div>
            <div id="tableContent"></div>
        </div>
    </div>

    <script>
        const ROWS_PER_PAGE = 50;
        let currentPage = 1;
        let allData = [];
        let filteredData = [];

        async function loadData() {
            try {
                // Try to load from agents_with_phones.csv
                const response = await fetch('agents_with_phones.csv');
                const csv = await response.text();
                parseCSV(csv);
                renderTable();
                updateStats();
            } catch (e) {
                document.getElementById('tableContent').innerHTML =
                    '<div class="no-data">📁 Waiting for CSV file... Upload agents_with_phones.csv to get started</div>';
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split('\t');

            allData = lines.slice(1).map(line => {
                const values = line.split('\t');
                const obj = {};
                headers.forEach((header, i) => {
                    obj[header.trim()] = (values[i] || '').trim();
                });
                return obj;
            });

            filteredData = [...allData];
        }

        function updateStats() {
            const total = allData.length;
            const found = allData.filter(a => a['Phone Number'] && a['Phone Number'].length > 0).length;
            const rate = total > 0 ? Math.round((found / total) * 100) : 0;
            const pending = total - found;

            document.getElementById('totalAgents').textContent = total;
            document.getElementById('phonesFound').textContent = found;
            document.getElementById('extractionRate').textContent = rate + '%';
            document.getElementById('pending').textContent = pending;
            document.getElementById('progressFill').style.width = rate + '%';
        }

        function renderTable() {
            const start = (currentPage - 1) * ROWS_PER_PAGE;
            const end = start + ROWS_PER_PAGE;
            const pageData = filteredData.slice(start, end);

            if (pageData.length === 0) {
                document.getElementById('tableContent').innerHTML =
                    '<div class="no-data">No results found</div>';
                return;
            }

            let html = '<table><thead><tr>';
            html += '<th>Agent Name</th>';
            html += '<th>Phone Number</th>';
            html += '<th>Brokerage</th>';
            html += '<th>Rating</th>';
            html += '<th>Sales (12mo)</th>';
            html += '</tr></thead><tbody>';

            pageData.forEach(row => {
                const hasPhone = row['Phone Number'] && row['Phone Number'].length > 0;
                html += '<tr>';
                html += `<td class="agent-name">${row['Full Name'] || '-'}</td>`;
                html += `<td><span class="phone ${!hasPhone ? 'empty' : ''}">${hasPhone ? row['Phone Number'] : 'Pending...'}</span></td>`;
                html += `<td>${row['Brokerage'] || '-'}</td>`;
                html += `<td>${row['Rating'] || '-'}</td>`;
                html += `<td>${row['Number of sales in past 12 mo'] || '-'}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';

            const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
            html += `<div class="pagination">Page ${currentPage} of ${totalPages} | Showing ${pageData.length} of ${filteredData.length} results</div>`;

            document.getElementById('tableContent').innerHTML = html;
        }

        function downloadCSV() {
            if (allData.length === 0) {
                alert('No data to download');
                return;
            }

            const headers = Object.keys(allData[0]);
            let csv = headers.join('\t') + '\n';

            allData.forEach(row => {
                const values = headers.map(h => row[h] || '');
                csv += values.join('\t') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'agents_with_phones.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            filteredData = allData.filter(row => {
                return Object.values(row).some(val =>
                    val.toLowerCase().includes(query)
                );
            });
            currentPage = 1;
            renderTable();
        });

        // Load data on page load
        loadData();

        // Refresh every 5 seconds
        setInterval(loadData, 5000);
    </script>
</body>
</html>
